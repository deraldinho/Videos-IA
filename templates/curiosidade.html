<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Video Template</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1080px;
        height: 1920px;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: background 0.5s ease;
      }
      body.bg-a { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
      body.bg-b { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); }
      body.bg-c { background: linear-gradient(135deg, #0f172a 0%, #064e3b 100%); }
      .container {
        text-align: center;
        padding: 40px;
        animation: fadeInUp 0.8s ease-out both;
      }
      h1 {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.2;
        margin-bottom: 24px;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        animation: pulseText 1.2s ease-in-out infinite;
      }
      p.desc {
        font-size: 28px;
        color: #cbd5e1;
        margin-bottom: 32px;
        line-height: 1.5;
        animation: fadeIn 1s ease-out both;
      }
      .hashtags {
        font-size: 24px;
        color: #22d3ee;
        font-weight: 800;
        animation: slideInLeft 0.8s ease-out both;
      }
      .badge {
        display: inline-block;
        padding: 16px 32px;
        background: rgba(34, 211, 238, 0.15);
        border: 3px solid #22d3ee;
        border-radius: 30px;
        color: #22d3ee;
        font-size: 22px;
        font-weight: 900;
        margin-top: 40px;
        animation: badgeGlow 1s ease-in-out infinite alternate;
      }
      .progress-track {
        width: 800px;
        height: 12px;
        background: rgba(255,255,255,0.15);
        border-radius: 6px;
        margin-top: 70px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #22d3ee, #f472b6);
        border-radius: 6px;
        width: 0%;
        animation: fillProgress 1.6s linear infinite;
      }
      .sparkle {
        position: absolute;
        width: 22px;
        height: 22px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 16px #22d3ee, 0 0 32px #f472b6;
        animation: sparkleMove 1.2s ease-in-out infinite;
      }
      .flash {
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.0);
        animation: flashBg 0.9s ease-in-out infinite;
      }
      .pulse-ring {
        position: absolute;
        width: 200px;
        height: 200px;
        border: 3px solid rgba(34, 211, 238, 0.4);
        border-radius: 50%;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        animation: ringExpand 2s linear infinite;
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(60px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-60px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes pulseText {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.75; }
      }
      @keyframes badgeGlow {
        from { box-shadow: 0 0 16px rgba(34, 211, 238, 0.4); border-color: #22d3ee; }
        to { box-shadow: 0 0 40px rgba(34, 211, 238, 0.9); border-color: #f472b6; }
      }
      @keyframes fillProgress {
        from { width: 0%; }
        to { width: 100%; }
      }
      @keyframes sparkleMove {
        0%   { top: 5%; left: 5%; opacity: 0; }
        25%  { top: 50%; left: 50%; opacity: 1; }
        50%  { top: 90%; left: 95%; opacity: 1; }
        75%  { top: 25%; left: 75%; opacity: 1; }
        100% { top: 5%; left: 5%; opacity: 0; }
      }
      @keyframes flashBg {
        0%, 100% { background: rgba(255,255,255,0.0); }
        50%  { background: rgba(255,255,255,0.1); }
      }
      @keyframes ringExpand {
        0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
      }
    </style>
</head>
<body class="bg-a">
    <div class="flash"></div>
    <div class="pulse-ring"></div>
    <div class="container">
      <h1>{{ title }}</h1>
      <p class="desc">{{ description }}</p>
      <div class="hashtags">{{ hashtags }}</div>
      <div class="badge">{{ badge }}</div>
      <div class="progress-track"><div class="progress-bar"></div></div>
    </div>
    <div class="sparkle"></div>
</body>
</html>
