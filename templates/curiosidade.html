<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>{{title}}</title>
<style>
  :root {
    --bg-start: #0f0c29;
    --bg-mid: #302b63;
    --bg-end: #24243e;
    --accent: #00f2ff;
    --accent-glow: rgba(0,242,255,0.4);
    --cta: #ffd700;
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.95);
    --radius: 30px;
    --safe-top: 120px;
    --safe-bottom: 180px;
    --safe-side: 60px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
  }
  .safe {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    padding: var(--safe-top) var(--safe-side) var(--safe-bottom) var(--safe-side);
    box-sizing: border-box;
    z-index: 2;
  }
  .badge {
    position: absolute; top: 60px; left: 60px;
    background: var(--accent); color: #000;
    padding: 10px 20px; border-radius: var(--radius);
    font-weight: 800; font-size: 1.1rem; letter-spacing: 1px;
    box-shadow: 0 4px 15px var(--accent-glow);
    animation: pulse 2s infinite;
    z-index: 3;
  }
  h1 { font-size: 2.6rem; line-height: 1.2; max-width: 900px; margin: 0 40px; }
  p.sub { font-size: 1.4rem; margin-top: 30px; max-width: 860px; line-height: 1.5; color: var(--text-dim); }
  .hashtags { margin-top: 40px; font-size: 1.3rem; color: var(--accent); font-weight: 700; }
  .cta { position: absolute; bottom: 120px; font-size: 1.5rem; font-weight: 800; color: var(--cta); z-index: 3; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.7;transform:scale(1.05);} }
  .fade-in { animation: fadeIn 0.8s ease-out forwards; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body>
  <div class="badge fade-in">{{badge_text}}</div>
  <div class="safe fade-in">
    <h1 class="fade-in">{{title}}</h1>
    <p class="sub fade-in">{{narration_text}}</p>
    <div class="hashtags fade-in">{{hashtags}}</div>
  </div>
  <div class="cta fade-in">{{cta_text}}</div>
</body>
</html>
