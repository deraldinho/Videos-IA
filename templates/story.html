<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>{{title}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #2c3e50, #000000, #4ca1af);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    transition: background 0.8s ease, transform 0.8s ease;
  }
  /* Variação DRAMÁTICA de background por cena */
  body.scene-0 { background: linear-gradient(135deg, #2c3e50, #000000, #4ca1af); }
  body.scene-1 { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); transform: rotate(1deg); }
  body.scene-2 { background: linear-gradient(135deg, #0d0d0d, #2c3e50, #1a1a2e); transform: rotate(-1deg); }
  body.scene-3 { background: linear-gradient(135deg, #1b1b2f, #162447, #0f0f23); transform: scale(1.02); }
  body.scene-4 { background: linear-gradient(135deg, #2c3e50, #000000, #4ca1af); transform: rotate(0deg) scale(1); }
  .badge {
    position: absolute; top: 60px; left: 60px;
    background: #4ca1af; color: #fff;
    padding: 10px 20px; border-radius: 30px;
    font-weight: 800; font-size: 1.1rem;
    animation: fadeIn 1s ease-out;
    transition: background 0.8s ease, color 0.8s ease, transform 0.8s ease;
  }
  .badge.scene-1 { background: #ffd700; color: #000; transform: rotate(-3deg); }
  .badge.scene-2 { background: #00e676; color: #000; transform: rotate(3deg); }
  .badge.scene-3 { background: #f472b6; color: #fff; transform: scale(1.1); }
  .badge.scene-4 { background: #ff6b6b; color: #fff; transform: rotate(0deg); }
  h1 { font-size: 2.5rem; line-height: 1.2; max-width: 900px; margin: 0 40px; transition: color 0.8s ease, transform 0.8s ease, text-shadow 0.8s ease; }
  h1.scene-1 { color: #ffd700; text-shadow: 0 0 30px #ffd700; transform: translateX(-20px); }
  h1.scene-2 { color: #00e676; text-shadow: 0 0 30px #00e676; transform: translateX(20px); }
  h1.scene-3 { color: #f472b6; text-shadow: 0 0 30px #f472b6; transform: scale(1.05); }
  h1.scene-4 { color: #ff6b6b; text-shadow: 0 0 30px #ff6b6b; transform: translateX(0); }
  .story-part {
    max-width: 860px; font-size: 1.5rem; line-height: 1.6;
    margin: 25px 0; opacity: 0;
    animation: appear 1s ease-out forwards;
    transition: transform 0.8s ease;
  }
  .story-part.scene-1 { transform: translateY(-30px); }
  .story-part.scene-2 { transform: translateY(30px); }
  .story-part.scene-3 { transform: scale(1.02); }
  .story-part.scene-4 { transform: translateY(0); }
  p.sub { font-size: 1.35rem; margin-top: 30px; max-width: 860px; line-height: 1.5; opacity: 0.95; transition: opacity 0.8s ease; }
  p.sub.scene-1 { opacity: 0.7; }
  p.sub.scene-2 { opacity: 0.9; }
  p.sub.scene-3 { opacity: 0.6; }
  p.sub.scene-4 { opacity: 0.95; }
  .narration { font-size: 1.5rem; line-height: 1.6; max-width: 860px; margin: 20px 40px; opacity: 0.9; transition: opacity 0.3s ease, transform 0.8s ease, color 0.8s ease; }
  .narration.scene-1 { color: #ffd700; transform: translateY(-20px); }
  .narration.scene-2 { color: #00e676; transform: translateY(20px); }
  .narration.scene-3 { color: #f472b6; transform: scale(1.03); }
  .narration.scene-4 { color: #ff6b6b; transform: translateY(0); }
  .hashtags { margin-top: 30px; font-size: 1.3rem; color: #4ca1af; font-weight: 700; transition: color 0.8s ease, transform 0.8s ease; }
  .hashtags.scene-1 { color: #ffd700; transform: rotate(-2deg); }
  .hashtags.scene-2 { color: #00e676; transform: rotate(2deg); }
  .hashtags.scene-3 { color: #f472b6; transform: scale(1.1); }
  .hashtags.scene-4 { color: #ff6b6b; transform: rotate(0); }
  .cta { position: absolute; bottom: 120px; font-size: 1.5rem; font-weight: 800; color: #fff; transition: color 0.8s ease, transform 0.8s ease; }
  .cta.scene-1 { color: #ffd700; transform: scale(1.1); }
  .cta.scene-2 { color: #00e676; transform: scale(0.9); }
  .cta.scene-3 { color: #f472b6; transform: scale(1.05); }
  .cta.scene-4 { color: #ff6b6b; transform: scale(1); }
  @keyframes appear { from{opacity:0;transform:scale(0.95);} to{opacity:1;transform:scale(1);} }
  .fade-in { animation: fadeIn 0.8s ease-out forwards; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
  /* Elementos decorativos DRAMÁTICOS que mudam por cena - sem blur excessivo */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(10px);
    opacity: 0.7;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .orb-1 { width: 600px; height: 600px; top: -50px; left: -50px; background: #4ca1af; }
  .orb-2 { width: 500px; height: 500px; bottom: -50px; right: -50px; background: #f472b6; }
  .orb-3 { width: 400px; height: 400px; top: 30%; left: -50px; background: #00e676; }
  .orb-4 { width: 300px; height: 300px; bottom: 20%; left: 10%; background: #ffd700; opacity: 0.5; }
  .orb-5 { width: 200px; height: 200px; top: 10%; right: 10%; background: #ff6b6b; opacity: 0.5; }
  .scene-1 .orb-1 { background: #ffd700; transform: scale(1.8) translate(150px, 150px); }
  .scene-1 .orb-2 { background: #ff6b6b; transform: scale(0.4) translate(-150px, -150px); }
  .scene-1 .orb-3 { background: #f472b6; transform: scale(2.5) translate(120px, -120px); }
  .scene-1 .orb-4 { background: #00e676; transform: scale(3) translate(-150px, 150px); }
  .scene-1 .orb-5 { background: #00e676; transform: scale(2) translate(100px, 100px); }
  .scene-2 .orb-1 { background: #00e676; transform: scale(0.5) translate(-120px, -120px); }
  .scene-2 .orb-2 { background: #4ca1af; transform: scale(1.8) translate(150px, 150px); }
  .scene-2 .orb-3 { background: #ffd700; transform: scale(3) translate(-180px, 180px); }
  .scene-2 .orb-4 { background: #ff6b6b; transform: scale(2.5) translate(180px, -180px); }
  .scene-2 .orb-5 { background: #f472b6; transform: scale(2) translate(-100px, -100px); }
  .scene-3 .orb-1 { background: #f472b6; transform: scale(2.2) translate(120px, 120px); }
  .scene-3 .orb-2 { background: #00e676; transform: scale(2) translate(-150px, -150px); }
  .scene-3 .orb-3 { background: #ffd700; transform: scale(3.2) translate(180px, -180px); }
  .scene-3 .orb-4 { background: #4ca1af; transform: scale(2) translate(-120px, 120px); }
  .scene-3 .orb-5 { background: #ff6b6b; transform: scale(1.5) translate(80px, 80px); }
  .scene-4 .orb-1 { background: #ff6b6b; transform: scale(1.8) translate(-80px, 80px); }
  .scene-4 .orb-2 { background: #ffd700; transform: scale(1.5) translate(80px, -80px); }
  .scene-4 .orb-3 { background: #f472b6; transform: scale(2.5) translate(-120px, -120px); }
  .scene-4 .orb-4 { background: #00e676; transform: scale(2.2) translate(120px, 120px); }
  .scene-4 .orb-5 { background: #4ca1af; transform: scale(1.2) translate(60px, 60px); }
  /* Barras laterais decorativas que mudam de posição/cor - MAIS ESPESSAS */
  .bar {
    position: absolute;
    width: 8px;
    height: 100%;
    transition: all 0.8s ease;
  }
  .bar-1 { left: 0; background: linear-gradient(to bottom, #4ca1af, transparent); }
  .bar-2 { right: 0; background: linear-gradient(to bottom, transparent, #f472b6); }
  .scene-1 .bar-1 { left: 40px; background: linear-gradient(to bottom, #ffd700, transparent); width: 12px; }
  .scene-1 .bar-2 { right: 40px; background: linear-gradient(to bottom, transparent, #ff6b6b); width: 12px; }
  .scene-2 .bar-1 { left: 80px; background: linear-gradient(to bottom, #00e676, transparent); width: 12px; }
  .scene-2 .bar-2 { right: 80px; background: linear-gradient(to bottom, transparent, #4ca1af); width: 12px; }
  .scene-3 .bar-1 { left: 20px; background: linear-gradient(to bottom, #f472b6, transparent); width: 12px; }
  .scene-3 .bar-2 { right: 20px; background: linear-gradient(to bottom, transparent, #00e676); width: 12px; }
  .scene-4 .bar-1 { left: 0; background: linear-gradient(to bottom, #ff6b6b, transparent); width: 8px; }
  .scene-4 .bar-2 { right: 0; background: linear-gradient(to bottom, transparent, #ffd700); width: 8px; }
  /* Quadrados de canto que mudam por cena - ELEMENTOS MUITO DISTINTOS */
  .corner {
    position: absolute;
    width: 120px;
    height: 120px;
    transition: all 0.8s ease;
  }
  .corner-tl { top: 20px; left: 20px; background: linear-gradient(45deg, #4ca1af, transparent); }
  .corner-tr { top: 20px; right: 20px; background: linear-gradient(-45deg, #f472b6, transparent); }
  .corner-bl { bottom: 20px; left: 20px; background: linear-gradient(-45deg, #00e676, transparent); }
  .corner-br { bottom: 20px; right: 20px; background: linear-gradient(45deg, #ffd700, transparent); }
  .scene-1 .corner-tl { background: linear-gradient(45deg, #ffd700, transparent); transform: rotate(45deg) scale(1.2); }
  .scene-1 .corner-tr { background: linear-gradient(-45deg, #ff6b6b, transparent); transform: rotate(-45deg) scale(1.2); }
  .scene-1 .corner-bl { background: linear-gradient(-45deg, #f472b6, transparent); transform: rotate(45deg) scale(1.2); }
  .scene-1 .corner-br { background: linear-gradient(45deg, #00e676, transparent); transform: rotate(-45deg) scale(1.2); }
  .scene-2 .corner-tl { background: linear-gradient(45deg, #00e676, transparent); transform: rotate(90deg) scale(0.8); }
  .scene-2 .corner-tr { background: linear-gradient(-45deg, #4ca1af, transparent); transform: rotate(-90deg) scale(0.8); }
  .scene-2 .corner-bl { background: linear-gradient(-45deg, #ffd700, transparent); transform: rotate(90deg) scale(0.8); }
  .scene-2 .corner-br { background: linear-gradient(45deg, #ff6b6b, transparent); transform: rotate(-90deg) scale(0.8); }
  .scene-3 .corner-tl { background: linear-gradient(45deg, #f472b6, transparent); transform: rotate(135deg) scale(1.5); }
  .scene-3 .corner-tr { background: linear-gradient(-45deg, #00e676, transparent); transform: rotate(-135deg) scale(1.5); }
  .scene-3 .corner-bl { background: linear-gradient(-45deg, #ffd700, transparent); transform: rotate(135deg) scale(1.5); }
  .scene-3 .corner-br { background: linear-gradient(45deg, #4ca1af, transparent); transform: rotate(-135deg) scale(1.5); }
  .scene-4 .corner-tl { background: linear-gradient(45deg, #ff6b6b, transparent); transform: rotate(0deg) scale(1); }
  .scene-4 .corner-tr { background: linear-gradient(-45deg, #ffd700, transparent); transform: rotate(0deg) scale(1); }
  .scene-4 .corner-bl { background: linear-gradient(-45deg, #f472b6, transparent); transform: rotate(0deg) scale(1); }
  .scene-4 .corner-br { background: linear-gradient(45deg, #00e676, transparent); transform: rotate(0deg) scale(1); }
</style>
</head>
<body>
  <div class="bar bar-1"></div>
  <div class="bar bar-2"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
  <div class="orb orb-5"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="badge fade-in">HISTÓRIA</div>
  <h1 class="fade-in">{{title}}</h1>
  <div class="story-part fade-in">{{story_body}}</div>
  <p class="sub fade-in">{{description}}</p>
  <div class="narration fade-in"></div>
  <div class="hashtags fade-in">{{hashtags}}</div>
  <div class="cta fade-in">Compartilhe essa história.</div>
</body>
</html>
