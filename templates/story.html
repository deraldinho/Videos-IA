<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>{{title}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #2c3e50, #000000, #4ca1af);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
  }
  .badge {
    position: absolute; top: 60px; left: 60px;
    background: #4ca1af; color: #fff;
    padding: 10px 20px; border-radius: 30px;
    font-weight: 800; font-size: 1.1rem;
    animation: fadeIn 1s ease-out;
  }
  h1 { font-size: 2.5rem; line-height: 1.2; max-width: 900px; margin: 0 40px; }
  .story-part {
    max-width: 860px; font-size: 1.5rem; line-height: 1.6;
    margin: 25px 0; opacity: 0;
    animation: appear 1s ease-out forwards;
  }
  p.sub { font-size: 1.35rem; margin-top: 30px; max-width: 860px; line-height: 1.5; opacity: 0.95; }
  .hashtags { margin-top: 30px; font-size: 1.3rem; color: #4ca1af; font-weight: 700; }
  .cta { position: absolute; bottom: 120px; font-size: 1.5rem; font-weight: 800; color: #fff; }
  @keyframes appear { from{opacity:0;transform:scale(0.95);} to{opacity:1;transform:scale(1);} }
  .fade-in { animation: fadeIn 0.8s ease-out forwards; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body>
  <div class="badge fade-in">HISTÓRIA</div>
  <h1 class="fade-in">{{title}}</h1>
  <div class="story-part fade-in">{{story_body}}</div>
  <p class="sub fade-in">{{description}}</p>
  <div class="hashtags fade-in">{{hashtags}}</div>
  <div class="cta fade-in">Compartilhe essa história.</div>
</body>
</html>
