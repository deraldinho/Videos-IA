<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>{{title}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
  }
  .badge {
    position: absolute; top: 60px; left: 60px;
    background: #00f2ff; color: #000;
    padding: 10px 20px; border-radius: 30px;
    font-weight: 800; font-size: 1.1rem; letter-spacing: 1px;
    box-shadow: 0 4px 15px rgba(0,242,255,0.4);
    animation: pulse 2s infinite;
  }
  h1 { font-size: 2.6rem; line-height: 1.2; max-width: 900px; margin: 0 40px; }
  p.sub { font-size: 1.4rem; margin-top: 30px; max-width: 860px; line-height: 1.5; opacity: 0.95; }
  .hashtags { margin-top: 40px; font-size: 1.3rem; color: #00f2ff; font-weight: 700; }
  .cta { position: absolute; bottom: 120px; font-size: 1.5rem; font-weight: 800; color: #ffd700; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.7;transform:scale(1.05);} }
  .fade-in { animation: fadeIn 0.8s ease-out forwards; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body>
  <div class="badge fade-in">CURIOSIDADE</div>
  <h1 class="fade-in">{{title}}</h1>
  <p class="sub fade-in">{{description}}</p>
  <div class="hashtags fade-in">{{hashtags}}</div>
  <div class="cta fade-in">Segue para mais!</div>
</body>
</html>
