name: CI - TikTok AI Autopilot

on:
  push:
    branches: [ main, master, feat/*, fix/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SystemRoot: C:\Windows
      ComSpec: C:\Windows\System32\cmd.exe

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $ffmpegDir = "$env:RUNNER_TEMP\ffmpeg-bin"
          $ffmpegExe = "$ffmpegDir\bin\ffmpeg.exe"
          if (-not (Test-Path $ffmpegExe)) {
            Write-Host "Baixando ffmpeg estático (GyanD build)"
            $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
            $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 300
            Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg-download"
            $extractedDir = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg-download" -Filter "ffmpeg-*" -Directory | Select-Object -First 1
            if (-not $extractedDir) {
              Write-Host "Não foi possível localizar diretório extraído do ffmpeg"
              exit 1
            }
            New-Item -ItemType Directory -Path $ffmpegDir -Force | Out-Null
            Move-Item -Path "$($extractedDir.FullName)\*" -Destination $ffmpegDir -Force
            Remove-Item -Path "$env:RUNNER_TEMP\ffmpeg-download" -Recurse -Force
            Remove-Item -Path $zip -Force
          }
          if (-not (Test-Path $ffmpegExe)) {
            Write-Host "ffmpeg.exe não encontrado em $ffmpegExe"
            exit 1
          }
          # Persistir PATH entre steps do GitHub Actions via GITHUB_ENV
          $currentPath = [Environment]::GetEnvironmentVariable("PATH", [EnvironmentVariableTarget]::Process)
          $newPath = "$($ffmpegDir)\bin;$currentPath"
          [Environment]::SetEnvironmentVariable("PATH", $newPath, [EnvironmentVariableTarget]::Process)
          echo "PATH=$newPath" >> $env:GITHUB_ENV
          echo "FFMPEG_DIR=$ffmpegDir" >> $env:GITHUB_ENV
          Write-Host "FFmpeg instalado em: $ffmpegDir\bin"
          Write-Host "Versão: $(Get-Command ffmpeg | Select-Object -ExpandProperty Source)"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências Node (Puppeteer + Chromium)
        run: npm install

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validar sintaxe e importação dos módulos
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.py -Path src | ForEach-Object { python -m py_compile $_.FullName }
          python -m py_compile main.py
          python -c "import src; print('src version:', src.__version__)"

      - name: Executar suíte pytest isolada (sem APIs externas)
        run: |
          python -m pytest tests/ -q -p no:cacheprovider

      - name: Análise estática (compileall + import check)
        run: |
          python -m compileall -q src tests
          python -c "import src.database, src.graph_orchestrator, src.publication_policy, src.video.hyperframes_adapter"

      - name: Relatório de cobertura (resumo)
        run: |
          python -m pytest tests/ -q --cov=src --cov-report=term-missing -p no:cacheprovider || true

  check-sem-segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Varredura de segredos (detect-secrets)
        run: |
          pip install detect-secrets || true
          touch .secrets.baseline
          detect-secrets scan --baseline .secrets.baseline || true
          # Não falhar a CI apenas por varredura; registra resultado para revisão.
          cat .secrets.baseline 2>/dev/null || echo "Nenhum baseline gerado."

      - name: Verificar ausência de arquivos proibidos
        run: |
          # .env, cookies, tokens, sessões não devem ser rastreados
          if git ls-files | grep -Ei '\.env$|credentials|secret\.json|tokens?|session' ; then
            echo "::error::Arquivo potencialmente sensível rastreado no Git."
            exit 1
          fi
          echo "Nenhum arquivo de credenciais rastreado."
