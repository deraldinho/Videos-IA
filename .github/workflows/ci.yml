name: CI - TikTok AI Autopilot

on:
  push:
    branches: [ main, master, feat/*, fix/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          winget install ffmpeg -s winget --accept-package-agreements --accept-source-agreements -h 2>$null
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "winget falhou; tentando download direto do ffmpeg"
            $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2024-01-13-12-33/ffmpeg-master-latest-win64-gpl.zip"
            $zip = "$env:TEMP\ffmpeg.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 120
            Expand-Archive -Path $zip -DestinationPath "$env:TEMP\ffmpeg"
            $exe = Get-ChildItem -Path "$env:TEMP\ffmpeg" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            if ($exe) {
              $dir = $exe.DirectoryName
              [Environment]::SetEnvironmentVariable("PATH", "$dir;[Environment]::GetEnvironmentVariable('PATH',[EnvironmentVariableTarget]::Process)", [EnvironmentVariableTarget]::Process)
              Write-Host "FFmpeg encontrado em: $dir"
            } else {
              Write-Host "FFmpeg não encontrado após download direto"
              exit 1
            }
          }

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validar sintaxe e importação dos módulos
        run: |
          python -m py_compile src/**/*.py main.py
          python -c "import src; print('src version:', src.__version__)"

      - name: Executar suíte pytest isolada (sem APIs externas)
        run: |
          python -m pytest tests/ -q -p no:cacheprovider

      - name: Análise estática (compileall + import check)
        run: |
          python -m compileall -q src tests
          python -c "import src.database, src.graph_orchestrator, src.publication_policy, src.video.hyperframes_adapter"

      - name: Relatório de cobertura (resumo)
        run: |
          python -m pytest tests/ -q --cov=src --cov-report=term-missing -p no:cacheprovider || true

  check-sem-segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Varredura de segredos (detect-secrets)
        run: |
          pip install detect-secrets || true
          touch .secrets.baseline
          detect-secrets scan --baseline .secrets.baseline || true
          # Não falhar a CI apenas por varredura; registra resultado para revisão.
          cat .secrets.baseline 2>/dev/null || echo "Nenhum baseline gerado."

      - name: Verificar ausência de arquivos proibidos
        run: |
          # .env, cookies, tokens, sessões não devem ser rastreados
          if git ls-files | grep -Ei '\.env$|credentials|secret\.json|tokens?|session' ; then
            echo "::error::Arquivo potencialmente sensível rastreado no Git."
            exit 1
          fi
          echo "Nenhum arquivo de credenciais rastreado."
