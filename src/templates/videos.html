{% extends "base.html" %}

{% block title %}Vídeos — TikTok AI Autopilot{% endblock %}

{% block content %}
<div class="space-y-5">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Vídeos</h1>
      <p class="text-gray-600">Lista de vídeos gerados pelo pipeline.</p>
    </div>
    <a href="/create" class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-semibold text-white bg-red-600 rounded-lg shadow hover:bg-red-700 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
      Novo vídeo
    </a>
  </div>

  <div class="flex flex-col lg:flex-row gap-4 items-end lg:items-start">
    <div class="flex items-center gap-2 w-full lg:w-auto">
      <label class="text-sm font-medium text-gray-700">Filtrar por status:</label>
      <select id="status-filter" class="text-sm border border-gray-300 rounded-md px-3 py-2 bg-white focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none">
        <option value="">Todos</option>
        {% for status in VIDEO_STATES %}<option value="{{ status }}">{{ status }}</option>{% endfor %}
      </select>
    </div>
    <div id="count" class="text-sm text-gray-500"></div>
  </div>

  <p id="error" class="hidden p-3 rounded-md border border-red-200 bg-red-50 text-red-800 text-sm"></p>

  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200 bg-white rounded-lg border border-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">ID do vídeo</th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Status</th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Tópico</th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Template</th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Criado em</th>
          <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Ações</th>
        </tr>
      </thead>
      <tbody id="videos-body" class="divide-y divide-gray-200">
        <!-- preenchido por JS -->
      </tbody>
    </table>
  </div>
  <p id="empty" class="hidden text-center py-8 text-sm text-gray-500">Nenhum vídeo encontrado.</p>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  const STATUS_LABELS = {
    IDEA_CREATED: 'Ideia criada', SCRIPT_READY: 'Roteiro pronto', RENDERING: 'Renderizando',
    RENDERED: 'Renderizado', VALIDATED: 'Validado', AWAITING_APPROVAL: 'Aguardando aprovação',
    APPROVED: 'Aprovado', UPLOADING: 'Enviando', UPLOADED: 'Enviado', QUEUED: 'Na fila',
    PUBLISHING: 'Publicando', PUBLISHED: 'Publicado', ACTION_REQUIRED: 'Ação requerida', FAILED: 'Falhou',
  };
  const STATUS_COLOR = {
    PUBLISHED: 'bg-green-100 text-green-800 border-green-200',
    APPROVED: 'bg-blue-100 text-blue-800 border-blue-200',
    AWAITING_APPROVAL: 'bg-amber-100 text-amber-800 border-amber-200',
    FAILED: 'bg-red-100 text-red-800 border-red-200',
    RENDERING: 'bg-purple-100 text-purple-800 border-purple-200',
    PUBLISHING: 'bg-indigo-100 text-indigo-800 border-indigo-200',
    UPLOADING: 'bg-cyan-100 text-cyan-800 border-cyan-200',
    QUEUED: 'bg-gray-100 text-gray-800 border-gray-200',
    IDEA_CREATED: 'bg-gray-100 text-gray-800 border-gray-200',
    SCRIPT_READY: 'bg-gray-100 text-gray-800 border-gray-200',
    RENDERED: 'bg-gray-100 text-gray-800 border-gray-200',
    VALIDATED: 'bg-gray-100 text-gray-800 border-gray-200',
    UPLOADED: 'bg-gray-100 text-gray-800 border-gray-200',
    ACTION_REQUIRED: 'bg-orange-100 text-orange-800 border-orange-200',
  };

  function badge(status) {
    const cls = STATUS_COLOR[status] || 'bg-gray-100 text-gray-600 border-gray-200';
    return '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full border text-xs font-medium border ' + cls + '">' +
      '<span class="w-1.5 h-1.5 rounded-full bg-current opacity-70"></span>' +
      window.escapeHtml(STATUS_LABELS[status] || status) + '</span>';
  }

  const statusFilter = document.getElementById('status-filter');
  const params = new URLSearchParams(window.location.search);
  if (params.get('status')) statusFilter.value = params.get('status');
  statusFilter.addEventListener('change', function () {
    const p = new URLSearchParams(window.location.search);
    if (this.value) p.set('status', this.value); else p.delete('status');
    window.location.search = p.toString();
  });

  async function load() {
    const body = document.getElementById('videos-body');
    const countEl = document.getElementById('count');
    const errorEl = document.getElementById('error');
    const empty = document.getElementById('empty');
    const p = new URLSearchParams(window.location.search);
    const url = '/api/videos' + (p.toString() ? '?' + p.toString() : '');
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const videos = data.videos || [];
      errorEl.classList.add('hidden');
      if (videos.length === 0) {
        body.innerHTML = '';
        empty.classList.remove('hidden');
        countEl.textContent = '';
        return;
      }
      empty.classList.add('hidden');
      countEl.textContent = videos.length + ' vídeo(s)';
      body.innerHTML = videos.map(function (v) {
        const created = v.created_at ? new Date(v.created_at).toLocaleString('pt-BR') : '-';
        var actions = '<a href="/videos/' + window.escapeHtml(v.video_id) + '" class="text-sm font-medium text-red-600 hover:underline">Detalhes</a>';
        return '<tr>' +
          '<td class="px-4 py-3 text-sm mono text-gray-900">' + window.escapeHtml(v.video_id) + '</td>' +
          '<td class="px-4 py-3">' + badge(v.status) + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-800 truncate max-w-xs" title="' + window.escapeHtml(v.topic || '') + '">' + window.escapeHtml(v.topic || '-') + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-600 mono">' + window.escapeHtml(v.template || '-') + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-600">' + created + '</td>' +
          '<td class="px-4 py-3 text-right">' + actions + '</td>' +
          '</tr>';
      }).join('');
    } catch (e) {
      errorEl.textContent = 'Não foi possível carregar os vídeos: ' + window.escapeHtml(String(e));
      errorEl.classList.remove('hidden');
      body.innerHTML = '';
      empty.classList.add('hidden');
    }
  }
  load();
})();
</script>
{% endblock %}
